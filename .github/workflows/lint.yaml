name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.15.13"
      - name: ruff check
        run: ruff check custom_components tests
      - name: ruff format --check
        run: ruff format --check custom_components tests

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component "ampio-mqtt==1.5.0" mypy
      - name: mypy --strict
        run: mypy --strict --no-incremental --ignore-missing-imports custom_components/ampio
