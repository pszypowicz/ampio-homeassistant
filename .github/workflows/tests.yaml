name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Core toolchain from requirements_test.txt, ampio-mqtt from the
      # manifest, so the gates test the version HACS and core install.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt "$(jq -r '.requirements[0]' custom_components/ampio/manifest.json)"
      - name: Run pytest
        run: pytest tests/ -q
